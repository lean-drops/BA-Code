<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Chroniken ↔ Werke — Navigator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://unpkg.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://unpkg.com 'unsafe-inline' 'unsafe-eval'; connect-src 'self';">
  <link rel="stylesheet" href="{{ url_for('static', filename='chroniken.css') }}">
  <script src="https://unpkg.com/cytoscape@3.28.0/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/cytoscape-fcose@2.2.1/cytoscape-fcose.js"></script>
</head>
<body class="index-body">
  <div class="index-wrap">
    <aside class="index-panel">
      <header class="index-header">
        <div class="index-title">chroniken_library ↔ Werke</div>
        <div class="index-sub">Interaktives Netz</div>
      </header>

      <section class="index-card">
        <input id="file" type="file" accept=".csv" class="index-file">
        <div class="index-actions">
          <button id="pick" class="index-btn">CSV wählen</button>
          <button id="upload" class="index-btn index-btn--primary">Laden</button>
          <button id="autoload" class="index-btn">Auto-Laden</button>
        </div>
        <div id="fname" class="index-hint">Keine Datei</div>
      </section>

      <section class="index-card index-grid2">
        <div>
          <label class="index-label" for="layout">Layout</label>
          <select id="layout" class="index-select">
            <option value="preset">preset</option>
            <option value="fcose">fcose</option>
            <option value="breadthfirst">breadthfirst</option>
            <option value="grid">grid</option>
          </select>
        </div>
        <div>
          <label class="index-label" for="thresh">Kantenschwelle: <span id="threshLabel">≥ 1</span></label>
          <input id="thresh" type="range" min="1" max="10" step="1" value="1" class="index-range">
        </div>
      </section>

      <section class="index-card index-grid2">
        <label class="index-check"><input id="labels" type="checkbox" checked> Labels</label>
        <label class="index-check"><input id="invert" type="checkbox"> Nicht-verbundene hervorheben</label>
      </section>

      <section class="index-card">
        <label class="index-label" for="search">Suche</label>
        <div class="index-actions">
          <input id="search" type="text" placeholder="Knotenlabel… Enter = Highlight" class="index-input">
          <button id="searchBtn" class="index-btn index-btn--primary" title="Ohne Shift: ersetzen • Mit Shift: hinzufügen">Hervorheben</button>
        </div>
        <div class="index-hint">Shift gedrückt halten, um mehrere Hervorhebungen zu sammeln. Überschneidende Kanten werden gestrichelt.</div>
        <div class="index-toolbar">
          <button id="clearSel" class="index-btn">Auswahl löschen</button>
          <button id="export" class="index-btn">PNG exportieren</button>
          <button id="fit" class="index-btn">Auf Inhalt zoomen</button>
          <span class="index-pill" id="stats">—</span>
        </div>
      </section>
    </aside>

    <main id="cy" class="index-canvas" aria-label="Graph"></main>
  </div>

  <script src="{{ url_for('static', filename='chroniken.js') }}"></script>
</body>
</html>
